name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MASTERMIND_ENVIRONMENT: test
  MASTERMIND_MONGODB_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0
  MASTERMIND_MONGODB_DATABASE: mastermind_test
  MASTERMIND_REDIS_URL: redis://127.0.0.1:6379/0
  MASTERMIND_AUTH_SIGNING_KEY: ci-only-auth-signing-key-material-32-bytes
  MASTERMIND_SECRET_ENCRYPTION_KEYS: '{"v1":"MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="}'
  MASTERMIND_SECRET_ACTIVE_KEY_VERSION: v1
  MASTERMIND_DAILY_HMAC_KEY: ci-only-daily-hmac-material-32-bytes-minimum
  MASTERMIND_PUBLIC_IDENTIFIER_HMAC_KEY: ci-only-identifier-hmac-material-32-bytes

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.23'
          enable-cache: true
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:8.0.14-noble --replSet rs0 --bind_ip_all
          for _ in $(seq 1 40); do
            docker exec mongodb mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1 && break
            sleep 1
          done
          docker exec mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for _ in $(seq 1 40); do
            docker exec mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && exit 0
            sleep 1
          done
          docker logs mongodb
          exit 1
      - run: uv sync --all-extras --frozen
      - run: uv run mastermind-initialize
      - name: Static checks
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
      - name: Python tests and core branch coverage
        run: >-
          uv run pytest
          --cov=packages/mastermind_core/mastermind_core
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=python-test-results.xml
          --cov-fail-under=95
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-coverage
          path: |
            coverage.xml
            python-test-results.xml
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:8000
      NEXT_PUBLIC_PRODUCT_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_PRODUCT_NAME: Cipherboard
      NEXT_PUBLIC_SUPPORT_EMAIL: support@example.invalid
      NEXT_PUBLIC_LEGAL_ENTITY: CI Test Entity
      NEXT_PUBLIC_JURISDICTION: CI
      NEXT_PUBLIC_POLICY_DATE: '2026-07-15'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm install --global pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - name: Web checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [python, web]
    services:
      redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports: ['6379:6379']
    env:
      MASTERMIND_ALLOWED_ORIGINS: '["http://127.0.0.1:3000"]'
      MASTERMIND_AUTH_ISSUER: http://127.0.0.1:8000
      MASTERMIND_PRODUCT_ORIGIN: http://127.0.0.1:3000
      MASTERMIND_RATE_LIMIT_PER_MINUTE: 10000
      MASTERMIND_SMTP_HOST: 127.0.0.1
      MASTERMIND_SMTP_PORT: 1025
      NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:8000
      NEXT_PUBLIC_PRODUCT_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_PRODUCT_NAME: Cipherboard
      NEXT_PUBLIC_SUPPORT_EMAIL: support@example.invalid
      NEXT_PUBLIC_LEGAL_ENTITY: CI Test Entity
      NEXT_PUBLIC_JURISDICTION: CI
      NEXT_PUBLIC_POLICY_DATE: '2026-07-15'
      PLAYWRIGHT_MAILPIT_URL: http://127.0.0.1:8025
      PLAYWRIGHT_ACCOUNT_DELETION_ENABLED: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.23'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm install --global pnpm@10.28.2
      - name: Start MongoDB and Mailpit
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:8.0.14-noble --replSet rs0 --bind_ip_all
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:v1.27.8
          for _ in $(seq 1 40); do
            docker exec mongodb mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1 && break
            sleep 1
          done
          docker exec mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
      - run: uv sync --all-extras --frozen && pnpm install --frozen-lockfile
      - run: uv run mastermind-initialize
      - name: Start API
        run: |
          uv run uvicorn mastermind_api.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null && exit 0
            sleep 2
          done
          sed -n '1,240p' /tmp/api.log
          exit 1
      - name: OpenAPI client drift
        run: pnpm generate:api && git diff --exit-code -- packages/api_client/src/schema.ts
      - run: pnpm --filter @mastermind/web exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build images
        run: |
          docker build -f infra/docker/api.Dockerfile -t mastermind-api:ci .
          docker build -f infra/docker/web.Dockerfile -t mastermind-web:ci \
            --build-arg NEXT_PUBLIC_API_ORIGIN=https://api.example.invalid \
            --build-arg NEXT_PUBLIC_PRODUCT_ORIGIN=https://play.example.invalid \
            --build-arg NEXT_PUBLIC_PRODUCT_NAME=Cipherboard \
            --build-arg NEXT_PUBLIC_SUPPORT_EMAIL=support@example.com \
            --build-arg NEXT_PUBLIC_LEGAL_ENTITY='CI Test Entity' \
            --build-arg NEXT_PUBLIC_JURISDICTION=CI \
            --build-arg NEXT_PUBLIC_POLICY_DATE=2026-07-15 .
