name: Desktop installers

on:
  pull_request:
    paths:
      - '.github/workflows/installers.yml'
      - 'apps/api/mastermind_api/account.py'
      - 'apps/api/mastermind_api/auth.py'
      - 'apps/api/mastermind_api/config.py'
      - 'apps/api/mastermind_api/main.py'
      - 'apps/cli/**'
      - 'apps/web/**'
      - 'infra/docker/**'
      - 'infra/installers/**'
      - 'installer/**'
      - 'packages/**'
      - 'supabase/**'
      - 'tests/installer/**'
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.23'
          enable-cache: true
      - name: Validate macOS shell launchers
        run: |
          bash -n 'installer/macos/Install Cipherboard.command'
          bash -n installer/runtime/macos/cipherboard
          bash -n installer/runtime/macos/cipherboard-services
          bash -n installer/runtime/macos/Cipherboard.app/Contents/MacOS/Cipherboard
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: installer-test
          SUPABASE_PUBLISHABLE_KEY: installer-test-public
          SUPABASE_SERVICE_ROLE_KEY: installer-test-service
          MASTERMIND_SECRET_ENCRYPTION_KEYS: '{"v1":"MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="}'
          MASTERMIND_DAILY_HMAC_KEY: installer-test-daily-key-material
          MASTERMIND_PUBLIC_IDENTIFIER_HMAC_KEY: installer-test-identifier-key-material
        run: docker compose -f installer/docker-compose.yml config --quiet
      - name: Build and test installer archives
        run: |
          python infra/installers/build_release_archives.py
          uv sync --frozen --all-extras
          uv run pytest tests/installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cipherboard-desktop-installers
          path: dist/installers/*
          if-no-files-found: error

  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Parse PowerShell installers and launchers
        shell: powershell
        run: |
          $failed = $false
          foreach ($path in @(
            'installer/windows/Install-Cipherboard.ps1',
            'installer/runtime/windows/cipherboard-services.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, windows-syntax]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cipherboard-desktop-installers
          path: installers
      - name: Attach installers to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" installers/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
